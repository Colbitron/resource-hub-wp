# One workspace for the three things that change together: the WordPress
# plugin at the path WordPress loads it from, the Next.js front end, and the
# contract package both consume (ADR 0033); and the CMS block theme beside the
# plugin, whose build copies that package's stylesheets and font.
packages:
  - wp-content/plugins/*
  - wp-content/themes/*
  - apps/*
  - packages/*

# Native or postinstall build scripts pnpm asked about. None are needed:
# - fs-ext-extra-prebuilt comes in through @php-wasm/node, which wp-env only
#   uses in its non-Docker Playground mode. We run Docker.
# - @parcel/watcher ships prebuilt binaries; its script only compiles a fallback.
# - core-js and core-js-pure only print a funding message.
# - sharp and unrs-resolver come in through Next.js and ship prebuilt binaries.
allowBuilds:
  fs-ext-extra-prebuilt: false
  "@parcel/watcher": false
  core-js: false
  core-js-pure: false
  sharp: false
  unrs-resolver: false

# Next 16.4.5 is newer than pnpm's minimum release age; these exclusions let it
# install. Remove them once the version has aged past the threshold.
minimumReleaseAgeExclude:
  - '@next/env@16.4.5'
  - '@next/eslint-plugin-next@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - eslint-config-next@16.4.5
  - next@16.4.5

# Dependabot fixes for transitive packages (tooling only: wp-scripts, wp-env,
# Lighthouse CI), each scoped to the vulnerable versions so nothing else moves.
# Two cross a major, and both are safe for their parents. serialize-javascript
# 7 needs Node 20+, escapes `</script` by default, throws on a spoofed
# toString, toISOString or RegExp source, and no longer mutates the input of
# ignoreFunction. copy-webpack-plugin 10 calls serialize() only to build string
# cache keys, so the worst case is a persistent-cache miss. basic-ftp 6's only
# break is refusing a PASV reply that names a different host (FTP bounce), and
# get-uri never relies on one. Remove an entry once its parent ships the fixed
# range.
overrides:
  basic-ftp@<6.2.1: ^6.2.1
  serialize-javascript@<7.1.3: ^7.1.3
  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
  smol-toml@<1.9.0: ^1.9.0
  qs@>=6.7.0 <6.16.1: ^6.16.1
