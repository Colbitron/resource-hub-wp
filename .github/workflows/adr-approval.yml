# Flags a pull request that changes an architecture decision record, or the
# guards on them, without the owner's approval. ADRs record the decisions
# that are expensive to undo, so no agent creates, amends, supersedes or
# deletes one without Colby's explicit approval in the conversation (root
# CLAUDE.md; the details are in .claude/rules/adr.md). A pull request that
# adds, modifies, renames or deletes a guarded path needs the `adr-approved`
# label, which only Colby applies; a rename counts when either its old or its
# new path is guarded. Without the label this check fails; with it, or with
# no guarded path changed, it passes.
#
# The guarded paths are GUARDED_PATHS below, the one list, mirrored in
# .claude/rules/adr.md: docs/adr/, and the three files that guard it (this
# workflow, the deny rules in .claude/settings.json, and the rule file), so a
# pull request that weakens a guard needs the label as well.
#
# Why `pull_request_target`: it runs the workflow as it is on the default
# branch, main, not as the pull request has it. A pull request therefore
# cannot delete this check or grade itself with an edited copy; a change to
# this file takes effect only once it is on main, and the pull request that
# introduces or edits it is checked by main's copy (the one that introduces
# it gets no run at all, because main has no copy yet). A run uses main's
# copy as of its event: a re-run keeps the original event's commit, so it
# runs that commit's copy of this file, not main's latest, while the labels
# and the file list are still read live. It also runs when the
# pull request has a merge conflict, where `pull_request` runs nothing.
#
# What its safety rests on, because this trigger runs with the base
# repository's token and secrets in reach:
# - No checkout. The job reads the pull request through the API and never
#   runs, builds or installs anything from it.
# - A read-only token: `permissions` below restricts it to
#   `pull-requests: read`. Without that key the token takes the repository's
#   workflow-permissions setting, read here today (Settings > Actions >
#   Workflow permissions) but a setting anyone with admin can flip. The key
#   stays because it pins the scope to `pull-requests: read` regardless, and
#   drops `contents` to none.
# - Inputs only through `env`: the run script interpolates no
#   pull-request-controlled string (title, body, branch name, file names);
#   it gets the repository and the pull request's number, and reads the rest
#   as data with jq.
# WARNING: adding a checkout of the pull request's head (or any step that
# runs its code) to this workflow creates the known "pwn request" hole, code
# from the pull request running with the base repository's token. Don't; if
# a check needs the pull request's code, it belongs in ci.yml under
# `pull_request`.
#
# The limits, stated plainly: this is a visible signal, not an enforcement.
# - Agents run `gh` with Colby's own credentials, so GitHub cannot tell his
#   label from one an agent applied; the label is an explicit, visible act,
#   not an identity check.
# - Branch protection is unavailable on this plan (the API answers 403), so a
#   red check flags the pull request but does not technically block a merge.
#   Merges are done by Colby, or on his word.
# - A direct push to main is not a pull request and gets no check; changes
#   reach main through merged pull requests, and CI pushes nothing there.
#
# A separate workflow, not a job in ci.yml: ci.yml's `pull_request` trigger
# runs the full gate once per push, and a label change must not re-run it.
# This job reads the pull request through the API (the file list, paginated,
# and the labels as they are now, not as the event saw them, so a re-run
# after the label is removed fails). It uses only the run's own token, no
# secrets.
name: ADR approval

# `edited` covers a change of base branch, which changes the file list; it
# also fires on title and body edits, which is harmless for a job this small.
# The job never skips itself with an `if:`, because a skipped job reports as
# a passing check and would hide an earlier failure.
# The job targets every base branch, so a pull request stacked on another
# branch is checked too; main's copy of this file runs for all of them.
on:
  pull_request_target:
    types: [ opened, synchronize, reopened, labeled, unlabeled, edited ]

concurrency:
  group: adr-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  adr-approval:
    name: ADR changes are approved
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A path ending in `/` guards everything under it; any other path
      # guards that one file. The pull request files API lists at most 3,000
      # files; if it lists fewer than the pull request's `changed_files`, the
      # check fails closed rather than pass on a partial list. Paths are
      # printed through jq's JSON encoding so a crafted file name cannot
      # inject a workflow command.
      - name: Check guarded paths against the adr-approved label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GUARDED_PATHS: |
            docs/adr/
            .github/workflows/adr-approval.yml
            .claude/settings.json
            .claude/rules/adr.md
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          files_json="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100")"

          changed="$(jq -r '.changed_files' <<<"${pr_json}")"
          listed="$(jq -s 'map(length) | add // 0' <<<"${files_json}")"
          if (( listed < changed )); then
            echo "::error title=ADR approval::The files API listed ${listed} of ${changed} changed files, so changes to guarded paths cannot be ruled out."
            echo "ADR approval: could not list every changed file (${listed} of ${changed}); failing closed." >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          guarded="$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"${GUARDED_PATHS}")"
          hits="$(jq -s -c --argjson guarded "${guarded}" '
            [.[][] | .filename, (.previous_filename // empty)]
            | map(select(. as $path | any($guarded[]; . as $g |
                if ($g | endswith("/")) then ($path | startswith($g)) else $path == $g end)))
            | unique' <<<"${files_json}")"
          count="$(jq 'length' <<<"${hits}")"
          approved="$(jq -r 'any(.labels[]; .name == "adr-approved")' <<<"${pr_json}")"

          if (( count == 0 )); then
            echo "ADR approval: no guarded path changed; no approval needed." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "Guarded paths changed:"
          jq -r '.[] | "  " + tojson' <<<"${hits}"

          if [[ "${approved}" == "true" ]]; then
            echo "ADR approval: ${count} guarded path(s) changed, approved with the adr-approved label." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "::error title=ADR approval::${count} guarded path(s) changed without the adr-approved label. Only Colby applies it."
          echo "ADR approval: ${count} guarded path(s) changed without the adr-approved label; only Colby applies it." >>"${GITHUB_STEP_SUMMARY}"
          exit 1
