# Depot CI Migration
# Source: .github/workflows/ci.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents
#
# Edited after the migration, for Depot CI:
# - this is the CI (ADR 0053); the source above is deleted, and git
#   history keeps it, which is how a rollback restores it
# - deploy and deploy-web also need the Depot CI variable
#   DEPOT_DEPLOY_ENABLED == 'true' (unset until the cutover)
# - the front end's one web job is split into parallel jobs, Lighthouse
#   across a matrix by URL, and the jobs that run Node share a composite
#   setup step (.depot/actions/setup-js); see "The jobs" below
# - the apt package cache for Playwright's system packages is gone: it
#   worked around a slow Ubuntu mirror on GitHub's runners, and on Depot CI
#   the whole browser install, apt included, took about 7 s uncached
# - a pull request runs only the jobs its changed paths can reach (the scope
#   job below) and never runs Lighthouse; every other event runs them all
#
# The gate. Every push to main and every manual dispatch runs the full
# chain: the plugin inside the same wp-env containers used locally, so a
# green run here means the same thing as a green run on a laptop, and the
# front end against its mock CMS, as e2e/README.md in apps/web runs it. A
# pull request runs the part of it that its changes reach, Lighthouse
# aside, which runs only off pull requests; see "Scoping a pull request"
# below.
#
# The jobs, and what each waits for (needs):
#
#   scope                    which sides a pull request's change reaches
#                            (.depot/scripts/ci-scope.mjs); on any other
#                            event it only says every job runs
#   gate                     needs scope. The plugin: schemas, JS lint,
#                            block build, PHPCS, PHPUnit, Playwright
#   web-checks               the front end's lint, typecheck, unit tests,
#                            production build and its fixture-route check
#   web-e2e                  the end-to-end suite, axe and document size included
#   web-screenshots          the specimen's screenshots and the brand images
#   web-lighthouse (x5)      Lighthouse CI, one shard of the URLs each
#                            (never on a pull request)
#   web-lighthouse-medians   needs web-lighthouse: one table of every median
#                            (never on a pull request)
#   ci-result                needs scope, gate and the three web jobs above,
#                            and always runs: red unless scope succeeded and
#                            each of the rest succeeded or, on a pull
#                            request, was skipped as scope's outputs say
#                            (.depot/scripts/ci-result.mjs). The one check a
#                            ruleset requires, CI / CI result. A new job
#                            goes in its needs or in the exempt list of
#                            ci-scope.test.mjs, whose test fails until then
#   deploy                   needs gate (main and dispatch only)
#   deploy-web               needs deploy and every web job (main only)
#
# Every job but the two deploys needs scope, though the list names it only
# for the gate and ci-result. Everything but scope, the two deploys, the
# medians and ci-result starts once scope has answered, about 6 to 8 s
# later than without it (trial runs 2nw1m59b8d, fxprsxt9wx), so a run
# waits for scope and then the slowest of the rest, not their sum. Each
# front-end job that serves the app builds its own copy of the end-to-end
# harness's build (RH_FIXTURES=1, the mock CMS), the same command at the
# same commit, rather than one job building it for the rest: the build
# takes about 10 s, less than a job's own start, so a shared build would
# only put a job in front of every consumer. Each job's build is stamped
# and checked as on a laptop (apps/web/e2e/build-stamp.mts).
#
# Order matters in one place: PHPUnit reinstalls the tests database, which
# deactivates every plugin on the tests site, so it runs before Playwright
# and the Playwright specs re-activate the plugin themselves.
#
# The front-end jobs need no secrets: they build against a placeholder CMS
# URL or the mock, and make no CMS calls at build time. Every one that runs
# on a pull request blocks its merge, and on main every one also blocks the
# front end's deploy, except a Lighthouse budget miss: on a push to main or
# a manual dispatch on main a missed budget is a warning, until issue #76
# calibrates it (see the Lighthouse job). Any other Lighthouse failure, such
# as a broken harness, still blocks the deploy. Lighthouse never runs on a
# pull request, so it never decides a merge, and a broken harness first
# shows up on main, where it holds deploy-web back until it is fixed; the
# author's `pnpm web:test:lighthouse:quick` before pushing
# (apps/web/e2e/README.md, "Lighthouse CI") is a smell test, not a gate.
# WCAG A and AA accessibility stays gated by the axe scan, which blocks
# both.
#
# The deploy job runs after the gate, only on main and on manual dispatch, and
# syncs the plugin, from wp-content/plugins/resource-hub-wp, to the Cloudways
# host (ADR 0005). The deploy-web job runs after deploy and every front-end
# job, and starts the front end's production deploy on Vercel through a
# deploy hook (ADR 0051).
#
# Lighthouse against the Vercel preview of each pull request that reaches
# the front end is a separate, non-blocking workflow,
# .depot/workflows/preview-lighthouse.yml, which reads the same scope rules
# (ADR 0053).
#
# Scoping a pull request. Depot CI bills each job's sandbox time, about
# 17.9 sandbox-minutes for the whole run (docs/runbooks/deploy.md, "CI
# cost"), so a pull request
# skips the jobs its changes cannot reach. On a pull request the scope job
# diffs the merge commit Depot checks out (refs/pull/N/merge) against its
# first parent, the base; the rules are in .depot/scripts/ci-scope.mjs:
# wp-content/ reaches the gate, apps/ the front-end jobs, docs/, .claude/,
# .github/, tools/ and a root *.md reach nothing, and everything else,
# packages/ui, the root package files and lockfile, .wp-env.json and
# .depot/ included, reaches both sides. Its outputs, 'true' or 'false', are
# plugin and web; when the paths cannot be read for certain both are
# 'true'. The diff is trusted only when HEAD's second parent is the pull
# request's head, github.event.pull_request.head.sha, since main's HEAD is
# itself usually a merge commit. That Depot checks out refs/pull/N/merge
# on a pull request is seen in run 8bt9mr07zz, Depot's pull_request run of
# PR #98 before this scoping existed (`depot ci workflow show 2z7chvtrxv`:
# trigger pull_request, ref refs/pull/98/merge). That it fills the head SHA
# is first confirmed by the first pull_request run of this workflow; it
# fails safe, since without the SHA every job runs and scope's summary
# says why.
#
# Every scoped job's condition is the same shape:
#
#   github.event_name != 'pull_request' || needs.scope.outputs.<side> == 'true'
#
# The Lighthouse shards' is its first half alone: they run on every event
# but pull_request, and are never scoped.
#
# On any event but pull_request it is true without reading the outputs,
# so a push to main, a manual dispatch and a tag dispatch run every job,
# as before, whatever the classifier says. The condition calls no status
# function, so it also takes the implicit success(): a job runs only once
# scope has succeeded, on every event. That is why scope runs on every
# event rather than being skipped off pull requests: a job whose need was
# skipped is skipped too, so the gate would have needed !cancelled() to run
# behind a skipped scope, and then the deploys' implicit success() would
# depend on how the host treats a skip further up the chain (Depot ran a
# job two levels below a skipped one in trial run h1bkmg53wt; GitHub
# Actions is reported to skip it). With scope always run, nothing on main is
# ever skipped (deploy-web's own if aside), and if scope fails there,
# nothing behind it runs but ci-result, which is red, as is the run. On a
# pull request, a failed scope likewise skips every job behind it (trial
# run h1bkmg53wt) but ci-result, which always runs and is red (trial run
# vr5gv4mtvq). A skipped job reports as skipped, not as passed or
# failed, and GitHub counts a skipped check as passing, so a ruleset
# requires ci-result's check rather than any scoped job's; see that job.
#
# The deploys cannot be reached by a skipped job. deploy needs the gate,
# deploy-web needs deploy and every front-end job, and neither condition
# calls a status function, so each takes the implicit success(): a need
# that was skipped, like one that failed, skips the deploy (a job shaped
# like deploy-web, behind one job that ran and one skipped by scope's
# output, was skipped in trial run h1bkmg53wt). Both also run
# only on a push or a dispatch, where nothing is scoped.
# web-lighthouse-medians keeps its !cancelled(), so it runs after a failed
# shard, and therefore tests scope's result and the event in its condition
# itself: !cancelled() alone would run it after skipped shards.
name: CI

# Pull requests run the workflow once. A plain `push:` trigger alongside
# `pull_request:` would run every branch twice, so pushes only count on main,
# where the merge commit needs its own run (and later, its deploy).
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# A newer push to a pull request supersedes the older run. On main and for
# manual dispatches a running run is never cancelled, because that would also
# cancel its deploy job mid-sync, which the deploy job's own concurrency group
# cannot prevent. GitHub keeps one waiting run per group and replaces it with
# a newer one, which is fine: the newer commit includes the older.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Caches are restored everywhere and saved only from main. A cache entry
# belongs to the ref that saved it: a pull request's run saves under
# refs/pull/N/merge, which only that pull request can read, while every
# run can also read what its base branch, main, saved. So entries saved on
# main serve every pull request, and an entry a pull request saved serves
# that pull request alone. On 2026-11-06 the repository's Actions cache was
# at its 10 GB limit, where GitHub evicts the least recently used entries,
# main's included: 18 of its 24 entries, about 8.2 GB, were per-PR copies
# of the ~460 MB pnpm store that actions/setup-node's `cache: pnpm` saved.
#
# So every cache below is an actions/cache/restore step and a separate
# actions/cache/save step (actions/cache@v6 has no input that turns its own
# save off), and each save runs only when SAVE_CACHES is true and its
# restore missed: cache-hit is 'true' only for an exact match of the key,
# so main never uploads an identical entry again. Each save runs straight
# after the step that fills the directory, so a later failure does not lose
# it. A manual dispatch on main saves too: it runs in main's scope, which
# pull requests read, so it can re-fill an evicted entry without waiting
# for a merge. A dispatch on a tag, which is how a rollback deploys, does
# not, since only that tag could read what it saved.
#
# On Depot CI the cache is Depot Cache, which does not isolate entries by
# branch (per Depot's docs for its GitHub Actions runners; assumed for Depot
# CI, whose docs do not say), so a pull request whose workflow saved a key
# would write an entry main reads (docs/runbooks/deploy.md, "Secrets"). The
# rule still keeps one store per lockfile, saved from a whole-workspace
# install (the gate's; see .depot/actions/setup-js).
env:
  SAVE_CACHES: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

jobs:
  scope:
    # Runs on every event, and only a pull request's run reads its outputs;
    # see "Scoping a pull request" above the triggers.
    name: "Scope: the jobs this change needs"
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugin: ${{ steps.scope.outputs.plugin }}
      web: ${{ steps.scope.outputs.web }}

    steps:
      - name: Not a pull request, so every job runs
        if: github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
        run: echo "Event $EVENT is not a pull request, so every job runs; the outputs are not read."

      # The merge commit and its two parents, so the diff is against the
      # base as the pull request would merge into it now; the diff reads
      # commits, not the working tree. `depot ci run` applies its patch of
      # local changes right after this step, which shapes it twice: it runs
      # on every event, though only a pull request reads the checkout, since
      # the patch step fails when this one was skipped (trial run
      # r02hgbd8qq); and it is not a sparse checkout of .depot/scripts, since
      # git cannot apply the patch to files a sparse checkout left out
      # (trial run lsq0blw8w6). It takes a few seconds either way.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # The runner's own Node and git; nothing is installed.
      - name: Test the scope rules and CI result's verdict
        if: github.event_name == 'pull_request'
        run: node --test .depot/scripts/ci-scope.test.mjs .depot/scripts/ci-result.test.mjs

      - name: Decide which jobs run
        if: github.event_name == 'pull_request'
        id: scope
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .depot/scripts/ci-scope.mjs --expect-head "$HEAD_SHA"

  gate:
    name: "Plugin: lint, build, and test"
    needs: [ scope ]
    if: github.event_name != 'pull_request' || needs.scope.outputs.plugin == 'true'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The whole workspace: wp-env is a root dependency and the plugin's
      # tooling lives in its own package. The only job that saves the pnpm
      # store, since the front-end jobs install part of the workspace.
      - name: Set up Node, pnpm and the JavaScript dependencies
        uses: ./.depot/actions/setup-js
        with:
          save-store: 'true'

      # The JSON Schema contract with the front end (ADR 0010): compiles every
      # schema in strict mode and checks every fixture. Pure Node, so it runs
      # before anything that needs Docker.
      - name: Test the contract schemas
        run: pnpm --filter @colbitron/resource-hub-ui test

      - name: Lint JavaScript
        run: pnpm lint:js

      - name: Build the block
        run: pnpm build

      # wp-env picks ~/wp-env (no dot) on Linux hosts that have /snap, which
      # GitHub's runners did. Pin the location so the cache path below is exact.
      # Playwright is a dependency of the plugin package, not the root, so its
      # version is read from there. A failed or garbled read fails the step
      # rather than caching under a key like playwright-Linux-: pnpm exits 0
      # and prints a message when the filter matches no package, so the value
      # is checked, not just the exit code.
      - name: Compute cache keys
        id: keys
        run: |
          playwright=$(pnpm --filter resource-hub-wp exec node -p "require('@playwright/test/package.json').version")
          if ! [[ "$playwright" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Could not read the Playwright version from resource-hub-wp (got: $playwright)."
            exit 1
          fi
          {
            echo "week=$(date -u +%G-W%V)"
            echo "playwright=$playwright"
            echo "wp_env_home=$RUNNER_TEMP/wp-env"
          } >> "$GITHUB_OUTPUT"
          echo "WP_ENV_HOME=$RUNNER_TEMP/wp-env" >> "$GITHUB_ENV"

      # wp-env downloads WordPress core and the core test library into
      # WP_ENV_HOME and reuses them when its config checksum matches. The weekly
      # suffix keeps the unpinned "latest" core from freezing at whatever was
      # cached first, so there are no restore keys: a fallback to last week's
      # entry would be saved again under this week's key and never refresh.
      # Until main runs in a new week, pull requests miss and download.
      - name: Restore wp-env downloads
        id: wp-env-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.keys.outputs.wp_env_home }}
          key: wp-env-${{ runner.os }}-${{ hashFiles('.wp-env.json') }}-${{ steps.keys.outputs.week }}

      # The restored directory holds wp-env's record of a finished setup,
      # wp-env-cache.json, beside the downloads. wp-env configures and installs
      # WordPress only when that record's config checksum differs from the
      # current one, but the databases live in Docker volumes that went with
      # the runner that saved the cache. Left in place, the record makes wp-env
      # skip the install on empty databases, and the afterStart hook then fails
      # with "The site you have requested is not installed". Deleting it keeps
      # the downloads and costs only the setup a fresh runner needs anyway:
      # wp-env fetches into an existing git checkout rather than cloning it
      # again, which covers the unpinned core and the test library here (a zip
      # source would be downloaded again). Deleting it here, not before the
      # save, also covers entries already saved with the record in them. The
      # step runs on every restore, not only an exact hit: on a miss there is
      # nothing to delete, and a partial match from restore-keys, if one is
      # ever added, restores the record while cache-hit reads false.
      - name: Forget the restored wp-env setup record
        run: rm -fv "${WP_ENV_HOME:?}"/*/wp-env-cache.json

      - name: Start wp-env
        run: pnpm env:start

      - name: Save wp-env downloads
        if: env.SAVE_CACHES == 'true' && steps.wp-env-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.keys.outputs.wp_env_home }}
          key: ${{ steps.wp-env-cache.outputs.cache-primary-key }}

      - name: Restore Composer vendor directory
        id: composer-cache
        uses: actions/cache/restore@v6
        with:
          path: wp-content/plugins/resource-hub-wp/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('wp-content/plugins/resource-hub-wp/composer.lock') }}

      - name: Install PHP dependencies
        run: pnpm composer install --no-interaction --no-progress --prefer-dist

      - name: Save Composer vendor directory
        if: env.SAVE_CACHES == 'true' && steps.composer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: wp-content/plugins/resource-hub-wp/vendor
          key: ${{ steps.composer-cache.outputs.cache-primary-key }}

      # PHPCS and PHPUnit run one after the other. Side by side they would
      # save about 7 s (each held about one of the two vCPUs), but two
      # `wp-env run` commands at once fail: the second reported
      # "Environment not initialized" in trial run s13jwxd9r0. PHPUnit runs
      # before Playwright, which it must, since it reinstalls the tests
      # database.
      - name: Lint PHP
        run: pnpm lint

      - name: Run PHPUnit
        run: pnpm test:php

      # The key holds the resolved Playwright version, so an upgrade misses and
      # downloads the new browser.
      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.keys.outputs.playwright }}

      # On a browser cache hit only the system packages are installed
      # (install-deps); on a miss the browser is downloaded too. It runs after
      # wp-env's start, not behind it: in the background it lengthened that
      # start from about 40 s to 49 and 54 s (trial runs s13jwxd9r0 and
      # k5tx59pw08), as much as it saved, since both wait on the network and
      # the disk rather than the CPU. The limit is generous for a slow
      # mirror; on Depot CI the whole install, uncached, took about 8 s.
      - name: Install Playwright browser
        timeout-minutes: 10
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = 'true' ]; then
            pnpm --filter resource-hub-wp exec playwright install-deps chromium
          else
            pnpm --filter resource-hub-wp exec playwright install --with-deps chromium
          fi

      - name: Save Playwright browser
        if: env.SAVE_CACHES == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # `wp-scripts test-playwright` runs `playwright install` first, which
      # downloads Firefox and WebKit too (about 5 s, 214 MB), though the
      # config runs Chromium alone, installed above; the variable skips it.
      - name: Run Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: wp-content/plugins/resource-hub-wp/artifacts/
          retention-days: 7

      - name: wp-env logs
        if: failure()
        run: pnpm exec wp-env logs tests --watch=false

  web-checks:
    name: "Front end: lint, typecheck, unit tests, and build"
    needs: [ scope ]
    if: github.event_name != 'pull_request' || needs.scope.outputs.web == 'true'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 15

    # A placeholder, never a secret. next.config.ts builds the /media/ rewrite
    # from WP_API_URL, so CI builds the same routes a deploy does; nothing
    # fetches from it during the build. cms.example is a reserved name that never
    # resolves. REVALIDATE_SECRET is read only when the revalidate route runs,
    # so it is not set here.
    env:
      WP_API_URL: https://cms.example/wp-json

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The front end and the workspace packages it depends on; wp-env's and
      # the plugin's packages are left out.
      - name: Set up Node, pnpm and the JavaScript dependencies
        uses: ./.depot/actions/setup-js
        with:
          filter: resource-hub-web...

      - name: Lint the front end
        run: pnpm web:lint

      - name: Typecheck the front end
        run: pnpm web:typecheck

      - name: Run the front end's unit tests
        run: pnpm web:test

      - name: Build the front end
        run: pnpm web:build

      # The fixture pages are routes only under RH_FIXTURES=1 (see
      # apps/web/e2e/README.md). This build runs without it, so if they reached
      # the output anyway, the test-only pages would ship.
      - name: Check the fixture routes are not in the production build
        run: |
          if [ -e apps/web/.next/server/app/fixtures ]; then
            echo "::error::The production build contains apps/web/.next/server/app/fixtures; the fixture routes must never ship."
            exit 1
          fi

  web-e2e:
    name: "Front end: end-to-end tests"
    needs: [ scope ]
    if: github.event_name != 'pull_request' || needs.scope.outputs.web == 'true'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 20

    # playwright.config.ts reads CI for forbidOnly, the retry, the reporter
    # and updateSnapshots: "none", so it is set here rather than left to
    # the host.
    env:
      CI: 'true'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node, pnpm and the JavaScript dependencies
        uses: ./.depot/actions/setup-js
        with:
          filter: resource-hub-web...

      # The browser and its system packages, for the suite and its axe scan.
      # No cache: on Depot CI the whole install, apt included, took about 7 s.
      - name: Install Playwright's browser
        timeout-minutes: 10
        run: pnpm --filter resource-hub-web exec playwright install --with-deps chromium

      # Starts the mock CMS (apps/web/e2e/mock-cms, plain Node, no Docker and
      # no secrets), builds with the test-only fixture routes (RH_FIXTURES=1)
      # and WP_API_URL pointing at the mock, stamps the build, and runs the
      # specs against `next start`; see apps/web/playwright.config.ts and
      # apps/web/e2e/README.md.
      - name: Run the front end's end-to-end tests
        run: pnpm web:test:e2e

      # Traces are kept only for failed tests (trace: retain-on-failure).
      - name: Upload the front end's Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  web-screenshots:
    name: "Front end: screenshots and brand images"
    needs: [ scope ]
    if: github.event_name != 'pull_request' || needs.scope.outputs.web == 'true'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 20

    # As in web-e2e: Playwright's updateSnapshots: "none", so CI never
    # writes a baseline, depends on CI, so it is set here.
    env:
      CI: 'true'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The screenshot tests run Chromium in Playwright's official Docker image,
      # pinned by digest in apps/web/e2e/playwright-image.mts. The image is
      # large, so its pull starts first, in the background, and overlaps the
      # install. The image's name is read with the runner's own Node, which
      # can strip the module's types (the flag is a no-op where that is the
      # default). The pull's exit status goes to a file that the "Wait for the
      # screenshot image" step below reads, so a failed pull shows as its own
      # error with its log, not as a late, slower pull inside the screenshot
      # step.
      - name: Start pulling the screenshot image
        id: image-name
        run: |
          docker_image=$(node --experimental-strip-types --no-warnings -e "import('./apps/web/e2e/playwright-image.mts').then((m) => console.log(m.PLAYWRIGHT_IMAGE))")
          if ! [[ "$docker_image" =~ ^mcr\.microsoft\.com/playwright:v[0-9.]+-[a-z]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the screenshot image from apps/web/e2e/playwright-image.mts (got: $docker_image)."
            exit 1
          fi
          echo "docker_image=$docker_image" >> "$GITHUB_OUTPUT"
          # The inner sh expands $1, $2 and $? itself, so the single quotes are intended.
          # shellcheck disable=SC2016
          nohup sh -c 'docker pull --platform linux/amd64 "$1"; echo $? > "$2"' sh "$docker_image" \
            "$RUNNER_TEMP/playwright-image-pull.status" > "$RUNNER_TEMP/playwright-image-pull.log" 2>&1 &

      - name: Set up Node, pnpm and the JavaScript dependencies
        uses: ./.depot/actions/setup-js
        with:
          filter: resource-hub-web...

      # Joins the background pull started above and fails here, with its log,
      # if it failed.
      - name: Wait for the screenshot image
        timeout-minutes: 10
        run: |
          status_file="$RUNNER_TEMP/playwright-image-pull.status"
          until [ -s "$status_file" ]; do sleep 2; done
          echo "::group::docker pull log"
          cat "$RUNNER_TEMP/playwright-image-pull.log"
          echo "::endgroup::"
          if [ "$(cat "$status_file")" != "0" ]; then
            echo "::error::Pulling ${{ steps.image-name.outputs.docker_image }} failed; the log is above."
            exit 1
          fi

      # The specimen page (app/fixtures/specimen/) against the baselines in
      # apps/web/e2e/__screenshots__/, in Chromium inside Playwright's Docker
      # image, as they were generated; the harness builds and stamps the
      # fixture app first, as for the end-to-end suite. A missing baseline
      # fails; CI never writes one. On a failure the actual and diff images
      # are in the traces artifact below, from the project's own output
      # directory. When CI and a laptop disagree on a baseline,
      # apps/web/e2e/README.md says what to do. The same run first checks the
      # committed brand images (apps/web/app/*.png, favicon.ico) against a
      # fresh render in the same container
      # (apps/web/scripts/render-brand-images.mts), and fails, naming the
      # file, when one is stale. The browser is the container's, so the
      # runner installs none.
      - name: Run the front end's screenshot tests
        run: pnpm web:test:screenshots

      - name: Upload the screenshot run's traces and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-screenshot-traces
          path: apps/web/test-results-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  web-lighthouse:
    # Lighthouse CI, mobile, five runs per sampled URL at Lighthouse's
    # fixed 4x CPU slowdown (apps/web/lighthouserc.cjs): performance at least
    # 0.95, accessibility 1, LCP at most 2500 ms, CLS at most 0.05, TBT at
    # most 200 ms, on the medians. Five runs of one URL take about 52 s on a
    # 2-vCPU sandbox whatever the URL, so the nine URLs are spread over
    # parallel jobs: RH_LIGHTHOUSE_SHARD=i/n takes every n-th URL from the
    # i-th (apps/web/e2e/lighthouse-shard.mts), so the shards measure every
    # URL once between them, and a shard with no URL fails. Each URL's five
    # runs stay in one job and every assertion reads one URL's median, so a
    # shard asserts exactly what a run of the whole list would for its URLs.
    # Each shard builds the harness's app and starts it with the mock, alone
    # on its sandbox, as the single job did: runs never share a CPU, which
    # would lengthen the main-thread tasks TBT is simulated from.
    #
    # Every shard runs on the same sandbox size as before the split, 2 vCPU,
    # so TBT stays comparable to the budget and to earlier runs. 4x
    # multiplies the runner's own task times, and the runner is faster than
    # the reference phone: calibrated to it, GitHub's runner CPUs measured
    # about 3.4x to 5x, so 4x is about right on the slowest and gentler than
    # a calibrated gate on the rest. Calibrating it is issue #76 (branch
    # lhci/snapshot-calibration). Each shard's medians go to its job summary,
    # and web-lighthouse-medians merges them into one table; the reports are
    # an artifact per shard.
    #
    # Never on a pull request (ADR 0053): the shards are most of a run's
    # sandbox-minutes, and until #76 a budget miss decides no merge anyway.
    # The cost is that a broken harness first shows up on main, where it
    # holds deploy-web back; the author runs `pnpm web:test:lighthouse:quick`
    # before pushing a front-end change, as a smell test
    # (apps/web/e2e/README.md), and main's run is the measurement of record.
    # The config refuses the quick settings when CI is set, which this job
    # sets itself rather than trusting the host to, so every shard runs five
    # times per URL and the medians job expects five.
    #
    # Until #76 lands, a budget miss does not decide the deploy. The
    # runners vary about 2-3x in CPU speed, and the fixed 4x slowdown
    # multiplies the runner's own task times, so TBT on identical code
    # ranges about 80 to 300 ms between runs: on 2026-11-07 main's run
    # 42362572282 failed it twice on slow runners after the same code had
    # passed on its pull request, which skipped the production deploy, and
    # PR #79 failed it at 201 and 209 ms against the 200 ms budget with no
    # runtime change. So on a push to main or a manual dispatch on main,
    # continue-on-error lets the step's failure through to the next step:
    # its outcome is still failure, its conclusion success. That step
    # passes the job, and with it deploy-web, only when the failure is a
    # missed budget on record, and fails it on any other Lighthouse
    # failure. The test names the events, not "always", so a dispatch on
    # another branch or a tag still fails on a miss, and a trigger added
    # later blocks by default. Leaving the budgets out of the gate is safe
    # for WCAG A and AA accessibility, which stays gated by the axe scan
    # inside the end-to-end suite on every WCAG 2.0-2.2 A and AA rule in
    # light and dark; Lighthouse's accessibility score also counts
    # best-practice rules that axe's WCAG tags leave out, and a miss there
    # is a warning like any other budget. The document-size check, the
    # screenshots and every other job still block. The budgets are the
    # same on every event and in every shard.
    name: "Front end: Lighthouse (${{ matrix.shard }}/${{ matrix.of }})"
    # It reads none of scope's outputs but still needs it, so that on main,
    # as for every other job, a failed scope runs nothing.
    needs: [ scope ]
    if: github.event_name != 'pull_request'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 15
    strategy:
      # Every shard runs to the end, so one shard's failure never hides
      # another's numbers; deploy-web needs them all either way.
      fail-fast: false
      # `of` is the shard count, beside the list it counts, because Depot CI
      # leaves strategy.job-total empty. A list longer than `of` fails its
      # extra shards (shard 6 of 5), and a shorter one leaves URLs unmeasured,
      # which web-lighthouse-medians fails on. Five shards of at most two
      # URLs each take about as long as the plugin's gate, the other long
      # job; more shards would add a sandbox's setup each and still wait on
      # the gate.
      matrix:
        shard: [ 1, 2, 3, 4, 5 ]
        of: [ 5 ]

    # CI is set here, not left to the host: lighthouserc.cjs refuses the
    # local smell-test settings only when it is.
    env:
      CI: 'true'
      RH_LIGHTHOUSE_SHARD: ${{ matrix.shard }}/${{ matrix.of }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node, pnpm and the JavaScript dependencies
        uses: ./.depot/actions/setup-js
        with:
          filter: resource-hub-web...

      # Lighthouse CI runs Playwright's Chromium (apps/web/lighthouserc.cjs).
      - name: Install Playwright's browser
        timeout-minutes: 10
        run: pnpm --filter resource-hub-web exec playwright install --with-deps chromium

      # Starts the mock, builds and stamps the harness's app (the build
      # prerenders from the mock, ADR 0043), starts it, warms this shard's
      # URLs and runs lhci collect, upload and assert on them
      # (apps/web/e2e/lighthouse.mts).
      - name: Run Lighthouse CI on the front end
        id: lighthouse
        continue-on-error: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: pnpm web:test:lighthouse

      # Runs only when every earlier step passed and Lighthouse's failure was
      # let through by continue-on-error: success() reads conclusions, which
      # continue-on-error turns to success, so it is true only then, and the
      # outcome test leaves out a run where Lighthouse passed. So it never
      # runs on a dispatch off main, where the failed step fails the job,
      # nor when an earlier step already failed the job, where the deploy is
      # blocked anyway and saying otherwise would be false. It reads the
      # failed assertions `lhci assert` saves (apps/web/.lighthouseci/,
      # which e2e/lighthouse.mts empties before each run, so nothing is
      # stale).
      #
      # Only a missed budget is a warning. When the file names at least one
      # failed error-level assertion, the step writes a warning annotation
      # and a job-summary line naming each URL and metric that missed, and
      # passes, saying the miss does not hold the deploy back (deploy-web
      # still has its own needs and head check, so it says no more than
      # that). When no failed assertion is on record (the file
      # is missing because a stage before the assertions failed, such as a
      # syntax error in lighthouserc.cjs or lighthouse.mts, a malformed
      # RH_LIGHTHOUSE_SHARD, Chromium failing to launch or a build-stamp
      # mismatch; or every assertion passed and the report upload failed; or
      # jq could not read the file), Lighthouse is broken rather than slow, so
      # the step writes an error and exits 1, which fails the job on every
      # event, the deploy on main included. The `title=` values hold no comma
      # or colon, which would need escaping as annotation properties. A
      # warning here is a finding to look at, not noise: if the same URL and
      # metric miss again on the next run, treat it as a regression
      # (docs/runbooks/deploy.md).
      - name: Report a Lighthouse budget miss, or fail on any other Lighthouse failure
        if: ${{ success() && steps.lighthouse.outcome == 'failure' }}
        env:
          RESULTS: apps/web/.lighthouseci/assertion-results.json
          ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/issues/76
          ARTIFACT: web-lighthouse-reports-${{ matrix.shard }}
        run: |
          misses=''
          if [ -s "$RESULTS" ]; then
            misses=$(jq -r '
              def num: if . == null then "n/a" elif . >= 10 then (. | round | tostring) else ((. * 1000 | round) / 1000 | tostring) end;
              [ .[] | select(.passed | not) | select(.level == "error")
                | "\(.url | sub("^[a-z]+://[^/]+"; "")) \(.auditId)\(if .auditProperty then ":" + .auditProperty else "" end) \(.actual | num) (budget \(.operator) \(.expected))" ]
              | join("; ")' "$RESULTS") || misses=''
          fi
          if [ -z "$misses" ]; then
            what="Lighthouse failed without a missed budget on record (a stage before the assertions, or the report upload, failed); its step's log says why. Only a missed budget is a warning until #76, so this fails the job."
            echo "::error title=Lighthouse failed without a missed budget::$what"
            {
              echo "### Lighthouse failed (blocking)"
              echo
              echo "${what/\#76/[#76]($ISSUE_URL)}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          what="Missed budget: $misses."
          advice="Lighthouse does not gate the production deploy until #76 calibrates it, so this miss does not hold the deploy back. This is a finding to look at: if the same URL and metric miss again on the next run, treat it as a regression."
          echo "::warning title=Lighthouse failed but did not block the deploy::$what $advice ($ISSUE_URL)"
          {
            echo "### Lighthouse failed (not blocking the deploy)"
            echo
            echo "$what ${advice/\#76/[#76]($ISSUE_URL)} The reports are in the $ARTIFACT artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      # Every Lighthouse report, pass or fail, from LHCI's filesystem target,
      # and the raw runs and assertions in .lighthouseci/, which
      # web-lighthouse-medians merges. The repository is private, so the
      # reports stay in the run's own artifacts, never in LHCI's temporary
      # public storage.
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-lighthouse-reports-${{ matrix.shard }}
          path: |
            apps/web/lighthouse-results/
            apps/web/.lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  web-lighthouse-medians:
    name: "Front end: Lighthouse medians"
    # One table of every URL's medians, merged from the shards' raw runs
    # (apps/web/e2e/lighthouse-merge.mts), in this job's summary, as the
    # single Lighthouse step used to write it. It also fails when a URL has
    # other than five runs, so a shard whose reports never arrived cannot
    # drop a URL from the table unnoticed. It decides nothing about the
    # budgets, which each shard asserted on its own URLs. It runs after a
    # failed shard too, so the table shows what was measured, and is skipped
    # with the shards on every pull request.
    needs: [ scope, web-lighthouse ]
    if: ${{ !cancelled() && needs.scope.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 10

    # The merge loads lighthouserc.cjs, which reads CI; set here, as in the
    # shards, rather than left to the host.
    env:
      CI: 'true'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The merge reads lighthouserc.cjs for the URLs and the runs per URL,
      # and the config requires Playwright for Chromium's path.
      - name: Set up Node, pnpm and the JavaScript dependencies
        uses: ./.depot/actions/setup-js
        with:
          filter: resource-hub-web...

      - name: Download the shards' Lighthouse reports
        uses: actions/download-artifact@v8
        with:
          pattern: web-lighthouse-reports-*
          path: ${{ runner.temp }}/lighthouse-shards

      - name: Merge the Lighthouse medians
        working-directory: apps/web
        run: node e2e/lighthouse-merge.mts "$RUNNER_TEMP/lighthouse-shards"

  ci-result:
    # The one check a GitHub ruleset requires on main, CI / CI result. The jobs
    # it reads cannot be required themselves: scope path-skips them on a pull
    # request, and GitHub counts a skipped check as passing, so a required gate
    # would pass on every pull request that skipped it. This job always runs
    # and is red unless scope succeeded and every other job it needs succeeded,
    # or, on a pull request only, was skipped because scope's output for its
    # side is 'false' (.depot/scripts/ci-result.mjs, deny by default). Scope
    # must succeed outright: a failed or cancelled scope skips every job behind
    # it, and those skips would otherwise pass. always() rather than
    # !cancelled(), so a cancelled need reports red here instead of a skip,
    # which would pass: cancelling a single job leaves this one to run and go
    # red (trial run t5sl0hv9hx). On Depot a whole-run cancel ends this job
    # outright, always() or not, with a cancelled check, which a ruleset treats
    # as failing (trial runs 2m7n9w5r68, 6tkfb69smt, psb4w3z0tr). Each step has
    # always() too, for hosts that run always() steps after a cancel, as GitHub
    # Actions does, where a step's implicit success() would skip it and a job
    # whose every step was skipped concludes success; so a rollback to GitHub
    # Actions cannot turn a cancelled run green. Lighthouse and its medians
    # never run on a pull request and the deploys only after a merge, so none
    # of them is read. A new job goes either in needs (and in ci-result.mjs's
    # JOBS) or in the exempt list of ci-scope.test.mjs's needs test, which
    # fails the scope job, and so this one, until it does.
    name: CI result
    needs: [ scope, gate, web-checks, web-e2e, web-screenshots ]
    if: ${{ always() }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5

    steps:
      # For the script. Its pull-request paths are tested in
      # ci-result.test.mjs, which the scope job runs, since a `depot ci run`
      # is never a pull request.
      - name: Check out
        if: ${{ always() }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Everything comes in through env, never interpolated into the script.
      - name: Check every job passed, or was skipped as scoped
        if: ${{ always() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ needs.scope.result }}
          SCOPE_PLUGIN: ${{ needs.scope.outputs.plugin }}
          SCOPE_WEB: ${{ needs.scope.outputs.web }}
          GATE: ${{ needs.gate.result }}
          WEB_CHECKS: ${{ needs.web-checks.result }}
          WEB_E2E: ${{ needs.web-e2e.result }}
          WEB_SCREENSHOTS: ${{ needs.web-screenshots.result }}
        run: node .depot/scripts/ci-result.mjs

  deploy:
    name: Deploy to the host
    # The CMS deploy waits only on the CMS's own CI, so a front-end failure or
    # flake can never block a CMS deploy or a rollback. The dependency runs
    # the other way: the front-end production deploy, deploy-web below, needs
    # both this job and every front-end job.
    needs: [ gate ]
    # Pushes only trigger on main already; the ref check keeps that true if the
    # trigger list ever widens. A manual dispatch deploys only from main or a
    # tag: a tag on an earlier commit is how a rollback is redeployed. Pushing
    # a tag does not start CI (the push trigger is main only), so a tag deploy
    # is always a dispatch.
    #
    # Depot CI cutover guard: the job runs only once the Depot CI variable
    # DEPOT_DEPLOY_ENABLED is 'true'. While it is unset, nothing here can
    # reach the host, whatever the event or ref. It kept the trial runs from
    # deploying while GitHub's copy of this workflow still did; that copy is
    # retired in the pull request that makes this the CI (ADR 0053), which
    # merges with the variable unset; it is set once main's first Depot run
    # is green, the first deploy is a watched dispatch, and a follow-up
    # drops the first line of the condition (docs/runbooks/deploy.md, "The
    # cutover switch"). Unsetting it is half of a rollback to
    # GitHub Actions (docs/runbooks/deploy.md). deploy-web carries the same
    # guard.
    if: >-
      vars.DEPOT_DEPLOY_ENABLED == 'true'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))))
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 10
    # One deploy at a time across every ref. A running deploy is never
    # cancelled; a waiting one is replaced by a newer one, which is fine
    # because the newer commit includes the older.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    # An explicit bash shell runs with -o pipefail, so a failed curl fails
    # the smoke check even though jq reads its output.
    defaults:
      run:
        shell: bash

    steps:
      # An unset secret reads as an empty string, which would otherwise surface
      # later as a confusing ssh or rsync error. Only names are printed.
      - name: Check the deploy secrets are set
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || {
              echo "::error::Depot CI secret $name is empty or not set."
              exit 1
            }
          done

      # DEPLOY_PATH is assumed to be the absolute path of the plugin directory
      # itself on the host, ending in wp-content/plugins/resource-hub-wp, not
      # the plugins directory above it. Anything else is refused, because
      # rsync --delete into the wrong directory would remove other plugins.
      # A CR or LF is refused too, since the value is written to GITHUB_ENV,
      # where a newline would start a new variable. REMOTE_DIR carries the
      # checked value to the later steps, and WP_ROOT carries the WordPress
      # root, which is that value without the plugin suffix.
      - name: Check the deploy path
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          case "$DEPLOY_PATH" in
            *$'\n'* | *$'\r'*)
              echo "::error::DEPLOY_PATH must be a single line."
              exit 1
              ;;
          esac
          path="${DEPLOY_PATH%/}"
          case "$path" in
            /*/wp-content/plugins/resource-hub-wp) ;;
            *)
              echo "::error::DEPLOY_PATH must be the absolute path of wp-content/plugins/resource-hub-wp on the host."
              exit 1
              ;;
          esac
          wp_root="${path%/wp-content/plugins/resource-hub-wp}"
          echo "REMOTE_DIR=$path" >> "$GITHUB_ENV"
          echo "WP_ROOT=$wp_root" >> "$GITHUB_ENV"

      # The deploy never talks to GitHub after checkout, so the token is not
      # left in .git/config.
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The whole workspace, as the gate installs it, since the block build
      # needs the plugin's tooling. The same store, key and rule as the
      # gate's (see .depot/actions/setup-js and the comment above `jobs`): on
      # main this job runs after the gate, which has usually saved the key
      # already, so it hits and saves nothing; on a tag nothing is saved.
      - name: Set up Node, pnpm and the JavaScript dependencies
        uses: ./.depot/actions/setup-js
        with:
          save-store: 'true'

      - name: Build the block
        run: pnpm build

      # The gate runs PHP inside the wp-env containers. The deploy only needs
      # Composer to write a production vendor/ directory, and starting Docker
      # and wp-env for that would cost minutes, so PHP runs on the runner here,
      # on the same 8.4 minor version as wp-env and the host.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install PHP dependencies for production
        working-directory: wp-content/plugins/resource-hub-wp
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      # The host key comes from a secret, so the first connection never trusts
      # an unknown key. The sandbox is discarded after the job, and the
      # job's last step removes the key and config before that anyway.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy
          chmod 600 ~/.ssh/known_hosts_deploy
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts_deploy
            GlobalKnownHostsFile /dev/null
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      # The source is the plugin directory itself, so the allowlist paths and
      # the host layout match one to one and nothing else in the workspace
      # (apps/, packages/, the root tooling) is ever a candidate.
      #
      # An allowlist: only what WordPress loads at runtime is sent, and
      # everything else is excluded by the final '*', so a new development-only
      # file never ships by default. A new runtime file or directory must be
      # added here. build/ and vendor/ are gitignored but still sent, because
      # rsync does not read .gitignore. blocks/ is block source and stays
      # behind; the block will be registered from its compiled copy in build/.
      #
      # --delay-updates writes every changed file aside and renames them all
      # at the end; --delete-delay (--delete, run after that) keeps removals
      # out of the window when old and new files are both being served.
      # --delete-excluded is not set, so anything on the host outside the
      # allowlist is left alone, not deleted.
      #
      # --omit-dir-times: with ./ as the source, rsync would otherwise set the
      # mtime of the plugin directory itself, which fails (exit 23) if
      # DEPLOY_USER does not own it, after the files are already in place.
      # --timeout ends a stalled transfer instead of waiting for the job limit.
      - name: Sync the plugin
        working-directory: wp-content/plugins/resource-hub-wp
        run: |
          rsync --archive --compress --no-owner --no-group --chmod=D755,F644 \
            --omit-dir-times --timeout=120 \
            --delete-delay --delay-updates --itemize-changes \
            '--include=/resource-hub.php' \
            '--include=/src/***' \
            '--include=/build/***' \
            '--include=/vendor/***' \
            '--exclude=*' \
            ./ "deploy:$REMOTE_DIR/"

      # WP-CLI runs from the WordPress root. It would walk up from the plugin
      # directory to find WordPress, but it evaluates wp-config.php without
      # changing directory, so the host's relative require('wp-salt.php')
      # resolves against the working directory and fails anywhere but the
      # root. Current WP-CLI already exits 0 for an active plugin, but the
      # host's version is not pinned, so the is-active check keeps the step
      # idempotent anyway.
      - name: Activate the plugin
        run: |
          dir=$(printf '%q' "$WP_ROOT")
          # $dir is meant to expand on the runner; printf %q has quoted it for the remote shell.
          # shellcheck disable=SC2029
          ssh deploy "cd $dir && { wp plugin is-active resource-hub-wp || wp plugin activate resource-hub-wp; }"

      # Activation clears the rewrite rules only when the plugin was inactive,
      # so a deploy that changes the permalink structure (ADR 0024) would keep
      # serving the old rules. A soft flush regenerates them in the database
      # on every deploy and writes no files. Run from the WordPress root for
      # the reason given above.
      - name: Flush rewrite rules
        run: |
          dir=$(printf '%q' "$WP_ROOT")
          # $dir is meant to expand on the runner; printf %q has quoted it for the remote shell.
          # shellcheck disable=SC2029
          ssh deploy "cd $dir && wp rewrite flush"

      # The site's own home URL, read over SSH, so no hostname is committed and
      # no extra secret is needed. jq checks the body is the REST index, not
      # an HTML error page served with a 200.
      - name: Smoke-check the REST root
        run: |
          dir=$(printf '%q' "$WP_ROOT")
          # $dir is meant to expand on the runner; printf %q has quoted it for the remote shell.
          # shellcheck disable=SC2029
          home=$(ssh deploy "cd $dir && wp option get home --skip-plugins --skip-themes")
          case "$home" in
            https://*) ;;
            *)
              echo "::error::The site's home option is not an https URL: $home"
              exit 1
              ;;
          esac
          curl -fsS --max-time 20 --retry 3 --retry-delay 5 "${home%/}/wp-json/" \
            | jq -e '.namespaces | index("wp/v2")' > /dev/null
          echo "REST root answered at ${home%/}/wp-json/"

      # Whether or not an earlier step failed, the key, the SSH config and
      # the pinned host key are removed, rather than trusting the sandbox's
      # disposal alone to take them.
      - name: Remove the SSH key and config
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts_deploy

  deploy-web:
    name: Deploy the front end to Vercel
    # The front end goes live only after the CMS it reads (ADR 0051; see
    # docs/runbooks/deploy.md), and only when its own lint, typecheck, unit
    # and end-to-end tests (axe and the document-size check included), build,
    # screenshots and brand-image check have passed on this commit: it needs
    # every front-end job, and a matrix job only succeeds when every one of
    # its shards does, so one failed Lighthouse shard holds it back. A
    # Lighthouse budget miss is reported but does not hold it back until
    # issue #76; any other Lighthouse failure does (see the web-lighthouse
    # job).
    needs: [ deploy, web-checks, web-e2e, web-screenshots, web-lighthouse, web-lighthouse-medians ]
    # Main only, on a push or a manual dispatch. Unlike the CMS deploy, a tag
    # dispatch does not deploy the front end: a deploy hook always builds the
    # head of main, never the tagged commit, so firing it from a rollback run
    # would ship main, not the rollback. The front end is rolled back on
    # Vercel instead, by promoting an earlier deployment (ADR 0051).
    #
    # The same Depot CI cutover guard as deploy's: never runs until the Depot
    # CI variable DEPOT_DEPLOY_ENABLED is 'true'. It needs deploy as well, so
    # the guard there would already skip it; this one keeps it off even if
    # that dependency changes.
    if: >-
      vars.DEPOT_DEPLOY_ENABLED == 'true'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 5
    # Its own group, so a front-end deploy never waits on, or holds up, the
    # CMS deploy group. Never cancelled; a waiting run is replaced by a newer
    # one, which is fine because the hook builds the head of main either way.
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    # The job reads one commit SHA from the API and checks nothing out.
    permissions:
      contents: read

    # An explicit bash shell runs with -o pipefail, so a failed curl fails the
    # step even though jq reads its output.
    defaults:
      run:
        shell: bash

    steps:
      # An unset secret reads as an empty string, which curl would report as a
      # malformed URL. Only the name is printed.
      - name: Check the deploy hook secret is set
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          [ -n "$VERCEL_DEPLOY_HOOK_URL" ] || {
            echo "::error::Depot CI secret VERCEL_DEPLOY_HOOK_URL is empty or not set."
            exit 1
          }

      # The hook takes no commit: Vercel builds whatever main points at when it
      # receives the request. CI runs on main one at a time, so by the time this
      # job runs a later merge may already be on main with its own run still
      # waiting, and firing now would ship that later commit before its gate.
      # So the hook fires only while main still points at the commit this run
      # tested; otherwise the later run, if green, deploys it.
      - name: Check main has not moved on
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now at $head, not $GITHUB_SHA; skipping. The run for the newer commit deploys the front end if its gate passes."
          fi

      # Fire and forget: the hook answers as soon as Vercel has queued the
      # build, and the job reports the queued job's id and state without
      # waiting on the build itself. Vercel shows the build's result, and a
      # failed build leaves the previous production deployment serving. The
      # URL is the credential, so it stays in the environment, is never
      # written into the script, and is never printed; curl's own error
      # messages name the host at most. No --retry: a POST that timed out may
      # still have queued a build, and rerunning the job is the retry.
      - name: Trigger the production deploy
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          response=$(curl --fail --silent --show-error -X POST --max-time 30 "$VERCEL_DEPLOY_HOOK_URL")
          job=$(jq -r '.job.id // empty' <<< "$response") || job=''
          state=$(jq -r '.job.state // "unknown"' <<< "$response") || state='unknown'
          if [ -z "$job" ]; then
            echo "::error::The deploy hook answered without a job id."
            exit 1
          fi
          echo "Vercel queued deploy job $job (state: $state) for $GITHUB_SHA."
